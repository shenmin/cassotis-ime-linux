units:
  - windows: src/common/nc_types.pas
    linux: src/common/nc_types.pas
    status: ported-platform-adaptation
    notes: Domain types and production engine state are retained; platform key events are converted to framework-neutral values at the IPC boundary.
  - windows: src/engine/nc_pinyin_parser.pas
    linux: src/engine/nc_pinyin_parser.pas
    status: ported-baseline
    notes: Algorithm preserved; Delphi RTL names and dynamic-array types adapted for FPC 3.2.2.
  - windows: src/engine/nc_shuangpin_decoder.pas
    linux: src/engine/nc_shuangpin_decoder.pas
    status: ported-baseline
    notes: All six Windows schemes and their regression behavior are represented by FPCUnit tests.
  - windows: src/engine/nc_fuzzy_pinyin.pas
    linux: src/engine/nc_fuzzy_pinyin.pas
    status: ported-baseline
    notes: Expansion rules, costs, metadata, and deduplication are preserved.
  - windows: src/common/nc_sqlite.pas
    linux: src/dictionary/nc_sqlite.pas
    status: ported-platform-adaptation
    notes: WinAPI loading was replaced with FPC Dynlibs; the tested SQLite semantics are preserved.
  - windows: src/engine/nc_dictionary_sqlite.pas
    linux: src/engine/nc_dictionary_sqlite.pas
    status: ported-production-provider
    notes: The schema-24 release provider and all ranking, completion, context, popularity, corpus, local-completion, and user-signal queries are retained; dynamic-library and filesystem calls use FPC compatibility units. The provider remains backward-compatible with schema 18 and later. The earlier Linux span-LM cache-miss fetch fix is retained, so a cold cache cannot silently skip bidirectional ranking. An isolated Windows v1.22.0 replay with the same fetch rule reproduces the three amd64 Top1 losses relative to the published Windows baseline; aggregate equality must not be claimed by reverting that fix.
  - windows: src/engine/nc_engine_intf.pas
    linux: src/engine/nc_engine_intf.pas
    status: ported-production-engine
    notes: Candidate recall, short/long ranking, document-local adaptation and copy completion, Pinyin-conditioned Transformer reranking and generation, constrained asynchronous local completion, context, user learning, deletion, completion, all seven pinyin schemes, fuzzy recall, and input-state behavior follow the Windows v1.22.0 source. Local repair runs on the final visible long-sentence pool with exact/user/word protection and coherent paging. Exact-anchor recall does not independently override final Top1, and asynchronous completion can challenge static transition evidence without hiding it while pending. Deterministic work budgets and stable explicit FPC sorts are retained. Subspan cache readiness and exact-edge probe flags remain initialized before early/fast paths.
  - windows: src/engine/nc_document_context_model.pas
    linux: src/engine/nc_document_context_model.pas
    status: ported-baseline
    notes: Bounded snapshot merging, n-gram evidence, document-key isolation, continuation lookup, accept/reject feedback, protected-context clearing, score caps, and generated tests are preserved. The repair model receives only the latest 256-unit snapshot tail, preserving sentence boundaries instead of merged historical evidence. Framework composition reset retains evidence for the same live context, while deactivation and context destruction clear it; IBus and Fcitx surrounding text supplies the snapshot at the platform boundary.
  - windows: src/engine/nc_*_model.pas and src/engine/nc_short_context_expanded_evidence.pas
    linux: src/engine/nc_*_model.pas and src/engine/nc_short_context_expanded_evidence.pas
    status: ported-generated-models
    notes: Forty-two generated model bodies plus expanded evidence were mechanically compared after normalizing compiler directives and unit names; constants, feature order, fixed scaling, and self-tests are unchanged.
  - windows: src/host/nc_pinyin_transformer_host.pas, src/host/nc_local_completion_host.pas, src/host/native/nc_pinyin_transformer_ort.cpp
    linux: src/host/nc_pinyin_transformer_host.pas, src/host/nc_local_completion_host.pas, src/host/native/nc_pinyin_transformer_ort.cpp
    status: ported-platform-adaptation
    notes: Windows DLL loading, UTF-16 paths, file mapping, and main-thread callbacks were replaced by ELF loading, UTF-8 paths, mmap, and a bounded Linux worker queue. The v1.22.0 conditional sequence scorer, constrained Pinyin and completion generators, learned invocation/runtime/fusion gates, multi-level completion index, lexical/combined/phonetic native recall selectors, confidence checks, completed-inference timeout semantics, and fail-closed behavior are retained for x86_64 and aarch64. Sparse generator arenas and glibc heap reclamation are Linux lifecycle adaptations and do not alter model inputs or decisions. All six sessions share ONNX Runtime x64 quantized precision mode and force_spinning_stop; an exact integer-arithmetic regression guards affected non-VNNI CPUs without changing model files or scales.
  - windows: src/engine/nc_local_repair_guard.pas, src/host/nc_local_repair_host.pas, src/host/native/nc_local_repair_ort.inc
    linux: src/engine/nc_local_repair_guard.pas, src/host/nc_local_repair_host.pas, src/host/native/nc_local_repair_ort.inc
    status: ported-platform-adaptation
    notes: The six-layer INT8 repair weights, pinyin/character constraints, confidence gates, word ratio, bounded context cache, edit/span limits and completed-call timeout are preserved. Delphi JSON, anonymous threads, and DLL calls use FPC JSON, an explicit joined worker, and the UTF-8 ELF ABI. Like the sparse generator, the two Linux repair sessions disable retained CPU arenas and memory patterns to limit shape-dependent peak allocation without changing inference inputs. The packaged manifest omits only machine-specific calibration audit fields; all inference settings and model hashes are checked against the baseline manifest. Native ABI tests exercise inference, reading constraints, cache identity, replacement and clearing.
  - windows: src/tsf
    linux: adapters/fcitx5 and adapters/ibus
    status: redesigned-native-thin-adapters
    notes: Native IBus C/GObject and Fcitx 5 C++ adapters share the versioned local IPC and contain no dictionary or ranking policy.
  - windows: src/ui
    linux: native framework UI and adapters/ibus/cassotis_settings.py
    status: redesigned-native-ui
    notes: Candidate/preedit placement is delegated to each framework with shared overflow geometry; completion is below candidates, and a GTK settings client controls engine-owned schema-4 state through IPC while preserving schema-1/2/3 compatibility.
