name: Linux CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fpc gcc g++ pkg-config sqlite3 libsqlite3-dev \
            libglib2.0-dev libibus-1.0-dev \
            fcitx5 fcitx5-modules libfcitx5core-dev libfcitx5config-dev \
            python3 python3-gi gir1.2-gtk-3.0
      - name: Validate scripts
        run: |
          find scripts packaging -type f -name '*.sh' -print0 | \
            xargs -0 -n1 bash -n
          python3 -m compileall -q adapters scripts tools
          python3 tools/parity/validate_docs.py
      - name: Build
        run: ./scripts/build.sh
      - name: Test
        run: ./scripts/test.sh --skip-build
